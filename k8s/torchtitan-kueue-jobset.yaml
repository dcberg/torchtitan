apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: torchtitan-kueue-jobset
  labels:
    kueue.x-k8s.io/queue-name: torchtitan
spec:
  network:
    enableDNSHostnames: true
    subdomain: torchtitan-kueue-jobset
  failurePolicy:
    maxRestarts: 0
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - trainer
  replicatedJobs:
    - name: trainer
      replicas: 2
      template:
        spec:
          completions: 1
          parallelism: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: torchtitan
                torchtitan/launcher: torchrun
            spec:
              restartPolicy: Never
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: trainer
                  image: your-registry/torchtitan:latest
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: JOBSET_NAME
                      value: torchtitan-kueue-jobset
                    - name: NNODES
                      value: "2"
                    - name: NPROC_PER_NODE
                      value: "8"
                    - name: MASTER_PORT
                      value: "29500"
                    - name: MODULE
                      value: llama3
                    - name: CONFIG
                      value: llama3_8b
                    - name: LOG_RANK
                      value: "0"
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                      value: "1"
                  command:
                    - bash
                    - -lc
                    - |
                      set -euo pipefail

                      # JobSet generates hostnames like:
                      #   <jobset>-trainer-<job-index>-0
                      NODE_RANK="$(echo "${HOSTNAME}" | awk -F- '{print $(NF-1)}')"
                      MASTER_ADDR="${JOBSET_NAME}-trainer-0-0.${JOBSET_NAME}"

                      exec torchrun \
                        --nnodes="${NNODES}" \
                        --nproc_per_node="${NPROC_PER_NODE}" \
                        --node_rank="${NODE_RANK}" \
                        --rdzv_backend=c10d \
                        --rdzv_endpoint="${MASTER_ADDR}:${MASTER_PORT}" \
                        --local-ranks-filter "${LOG_RANK}" \
                        --role rank \
                        --tee 3 \
                        -m torchtitan.train \
                        --module "${MODULE}" \
                        --config "${CONFIG}"
                  resources:
                    requests:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: 8
                    limits:
                      nvidia.com/gpu: 8
                  volumeMounts:
                    - name: torchtitan-data
                      mountPath: /workspace/data
              volumes:
                - name: torchtitan-data
                  persistentVolumeClaim:
                    # See k8s/torchtitan-oke-fss-pvc.yaml for an OKE-friendly
                    # RWX example claim backed by File Storage Service.
                    claimName: torchtitan-oke-fss
