apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: torchtitan-phx-a10
  namespace: torchtitan-phx
  labels:
    kueue.x-k8s.io/queue-name: torchtitan-phx-a10-2
spec:
  network:
    enableDNSHostnames: true
    subdomain: torchtitan-phx-a10
  failurePolicy:
    maxRestarts: 0
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - trainer
  replicatedJobs:
    - name: trainer
      replicas: 3
      template:
        spec:
          completions: 1
          parallelism: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: torchtitan
            spec:
              restartPolicy: Never
              priorityClassName: torchtitan-batch
              nodeSelector:
                oke.oraclecloud.com/pool.name: gpu-a10-2
                node.kubernetes.io/instance-type: VM.GPU.A10.2
              containers:
                - name: trainer
                  image: phx.ocir.io/odx-mockcustomer/torchtitan:0.0.2
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: JOBSET_NAME
                      value: torchtitan-phx-a10
                    - name: MASTER_PORT
                      value: "29500"
                    - name: NNODES
                      value: "3"
                    - name: NPROC_PER_NODE
                      value: "2"
                    - name: MODULE
                      value: llama3
                    - name: CONFIG
                      value: llama3_debugmodel
                    - name: LOG_RANK
                      value: "0"
                    - name: HF_ASSETS_PATH
                      value: /workspace/tokenizer
                    - name: NCCL_SOCKET_IFNAME
                      value: eth0
                    - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                      value: "1"
                    - name: LD_LIBRARY_PATH
                      value: /opt/host-nvidia/lib:/usr/lib/x86_64-linux-gnu:/usr/local/lib64:/usr/local/lib
                  command:
                    - bash
                    - -lc
                    - |
                      set -euo pipefail

                      mkdir -p /opt/host-nvidia/lib
                      ln -sf /opt/host-usr-lib64/libcuda.so /opt/host-nvidia/lib/libcuda.so
                      ln -sf /opt/host-usr-lib64/libcuda.so.1 /opt/host-nvidia/lib/libcuda.so.1
                      ln -sf /opt/host-usr-lib64/libnvidia-ml.so.1 /opt/host-nvidia/lib/libnvidia-ml.so.1

                      # JobSet pod hostnames look like:
                      #   <jobset>-trainer-<job-index>-0
                      NODE_RANK="$(echo "${HOSTNAME}" | awk -F- '{print $(NF-1)}')"
                      MASTER_ADDR="${JOBSET_NAME}-trainer-0-0.${JOBSET_NAME}"

                      exec torchrun \
                        --nnodes="${NNODES}" \
                        --nproc_per_node="${NPROC_PER_NODE}" \
                        --node_rank="${NODE_RANK}" \
                        --rdzv_backend=c10d \
                        --rdzv_endpoint="${MASTER_ADDR}:${MASTER_PORT}" \
                        --local-ranks-filter "${LOG_RANK}" \
                        --role rank \
                        --tee 3 \
                        -m torchtitan.train \
                        --module "${MODULE}" \
                        --config "${CONFIG}" \
                        --dataloader.dataset c4 \
                        --hf_assets_path "${HF_ASSETS_PATH}" \
                        --dump_folder /workspace/data \
                        --checkpoint.folder checkpoints
                  resources:
                    requests:
                      cpu: "48"
                      memory: 384Gi
                      ephemeral-storage: 8Gi
                      nvidia.com/gpu: 2
                    limits:
                      cpu: "48"
                      memory: 384Gi
                      ephemeral-storage: 8Gi
                      nvidia.com/gpu: 2
                  volumeMounts:
                    - name: torchtitan-data
                      mountPath: /workspace/data
                    - name: host-usr-lib64
                      mountPath: /opt/host-usr-lib64
                      readOnly: true
                    - name: host-nvidia-lib
                      mountPath: /opt/host-nvidia/lib
                    - name: dshm
                      mountPath: /dev/shm
                    - name: tokenizer-assets
                      mountPath: /workspace/tokenizer
                      readOnly: true
              volumes:
                - name: torchtitan-data
                  persistentVolumeClaim:
                    claimName: torchtitan-oke-fss
                - name: host-usr-lib64
                  hostPath:
                    path: /usr/lib64
                    type: Directory
                - name: host-nvidia-lib
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 8Gi
                - name: tokenizer-assets
                  configMap:
                    name: torchtitan-test-tokenizer
